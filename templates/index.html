<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impostor Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #f5f5f5;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .card {
            background: #1d1d1d;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        h1, h2 {
            margin-top: 0;
        }

        input {
            width: 100%;
            max-width: 400px;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #0f0f0f;
            color: white;
        }

        button {
            background: white;
            color: black;
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .muted {
            color: #bbbbbb;
        }

        .warning-box {
            display: none;
            align-items: flex-start;
            gap: 10px;
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 110, 110, 0.45);
            background: rgba(120, 18, 18, 0.20);
            color: #ffd4d4;
        }

        .warning-box.active {
            display: flex;
        }

        .warning-icon {
            font-size: 1.05rem;
            line-height: 1.2;
        }

        .warning-text {
            line-height: 1.4;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>IMPOSTOR Hackathon Game</h1>

        <div class="card">
            <h2>Create Game</h2>
            <p class="muted">Create a new game and invite others to join!</p>
            <button onclick="createGame()">Create Game</button>
        </div>

        <div class="card">
            <h2>Join Game</h2>
            <input id="code" placeholder="Enter Code" maxlength="10">
            <input id="team" placeholder="Team Name" maxlength="30">
            <button id="joinBtn" onclick="joinGame()">Join Game</button>

            <div id="joinWarningBox" class="warning-box">
                <div class="warning-icon">⚠</div>
                <div id="joinWarningText" class="warning-text">Invalid game code.</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
    <script>
        const socket = io();

        const codeInputEl = document.getElementById("code");
        const teamInputEl = document.getElementById("team");
        const joinBtn = document.getElementById("joinBtn");
        const joinWarningBox = document.getElementById("joinWarningBox");
        const joinWarningText = document.getElementById("joinWarningText");

        let pendingJoinPayload = null;

        socket.on("connect", () => {
            console.log("Connected to server");
        });

        function showJoinWarning(message) {
            joinWarningText.textContent = message;
            joinWarningBox.classList.add("active");
        }

        function hideJoinWarning() {
            joinWarningBox.classList.remove("active");
            joinWarningText.textContent = "";
        }

        codeInputEl.addEventListener("input", hideJoinWarning);
        teamInputEl.addEventListener("input", hideJoinWarning);

        function createGame() {
            localStorage.removeItem("teamName");
            localStorage.setItem("isHost", "true");
            socket.emit("create_game");
        }

        function joinGame() {
            const codeInput = codeInputEl.value.trim().toUpperCase();
            const teamInput = teamInputEl.value.trim();

            hideJoinWarning();

            if (!codeInput) {
                showJoinWarning("Please enter a game code.");
                return;
            }

            if (!teamInput) {
                showJoinWarning("Please enter a team name.");
                return;
            }

            pendingJoinPayload = {
                code: codeInput,
                team: teamInput
            };

            joinBtn.disabled = true;
            socket.emit("validate_join_request", {
                code: codeInput,
                team_name: teamInput
            });
        }

        socket.on("join_validation_result", (data) => {
            joinBtn.disabled = false;

            if (!data?.ok) {
                showJoinWarning(data?.message || "That game code could not be found.");
                pendingJoinPayload = null;
                return;
            }

            if (!pendingJoinPayload) return;

            localStorage.setItem("teamName", pendingJoinPayload.team);
            localStorage.setItem("code", pendingJoinPayload.code);
            localStorage.setItem("isHost", "false");

            window.location.href = `/game?code=${encodeURIComponent(pendingJoinPayload.code)}&team=${encodeURIComponent(pendingJoinPayload.team)}`;
        });

        socket.on("game_created", (data) => {
            const code = data.code;
            localStorage.setItem("code", code);
            localStorage.setItem("isHost", "true");
            window.location.href = `/game?code=${encodeURIComponent(code)}&host=1`;
        });

        socket.on("error", (msg) => {
            joinBtn.disabled = false;
            showJoinWarning(msg || "Something went wrong.");
        });
    </script>
</body>
</html>
